        function downloadMonthlyEnergyData() {
            if (!currentMonthlyData || currentMonthlyData.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'No Data to Download',
                    text: 'Please fetch monthly data first before downloading.'
                });
                return;
            }

            const month = monthPicker.value;
            const year = yearPicker.value;
            
            // Create CSV content
            let csvContent = "Date,Device Name,Energy Consumption (kWh)\n";
            
            // Get all unique days from the data
            const uniqueDays = [...new Set(currentMonthlyData.map(item => item._id))].sort((a, b) => a - b);
            
            // Group data by device and day
            const groupedData = {};
            currentMonthlyData.forEach(item => {
                const deviceInfo = mergedArray.find(device => device.split(',')[1] === item.ud_id);
                const deviceName = deviceInfo ? deviceInfo.split(',')[0] : 'Unknown Device';
                
                if (!groupedData[item._id]) {
                    groupedData[item._id] = {};
                }
                
                const energyInKWh = (item.avg_energy / 3600000).toFixed(2);
                groupedData[item._id][deviceName] = energyInKWh;
            });
            
            // Create rows for each day
            uniqueDays.forEach(day => {
                const formattedDate = `${day.toString().padStart(2, '0')}/${month.toString().padStart(2, '0')}/${year}`;
                
                // Get all unique device names
                const allDeviceNames = [...new Set(mergedArray.map(device => device.split(',')[0]))];
                
                allDeviceNames.forEach(deviceName => {
                    const energyConsumption = groupedData[day] && groupedData[day][deviceName] ? groupedData[day][deviceName] : '0.00';
                    csvContent += `${formattedDate},"${deviceName}",${energyConsumption}\n`;
                });
            });
            
            // Create and download file
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', `Energy_Consumption_${month.toString().padStart(2, '0')}_${year}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                Swal.fire({
                    icon: 'success',
                    title: 'Download Started',
                    text: 'Your energy consumption data has been downloaded successfully!'
                });
            }
        }

        window.onload = function () {

                            { ...obj, ud_id: device }
                        ));
                        totalvalue.push(...mergedArray);
                    })
                    .catch(error => console.error('Error fetching energy data for Day:', error));
            });


            Promise.all(fetchPromises)
                .then(() => {

                    console.log("Total Energy Data for Day:", totalvalue);
                    handleEnergyDataResponse(matchingDevices, totalvalue, 'day');
                })
                .catch(error => {
                    console.error('Error in fetching all energy data for day:', error);
                });
        }



        function fetchEnergyDataForMonth(matchingDevices, month, year) {
            const totalvalue = [];
            const deviceIds = matchingDevices.map(device => device.ud_id);
            console.log("d_id", deviceIds);


            const fetchPromises = deviceIds.map(device => {
                return fetch('https://partner.feturtles.com/integrations/ctp/go', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "intent": "action.entities.ENERGY_DATA",
                        "payload": {
                            "device_ids": [device],
                            "duration": "month",
                            "month": parseInt(month),
                            "year": parseInt(year),
                            "api_v": 2
                        }
                    })
                })
                    .then(response => response.json())
                    .then(energyData => {
                        console.log('Energy Data for Month:', energyData);
                        const mergedArray = energyData.map(obj => (
                            { ...obj, ud_id: device }
                        ));
                        totalvalue.push(...mergedArray);
                    })
                    .catch(error => console.error('Error fetching energy data for month:', error));
            });


            Promise.all(fetchPromises)
                .then(() => {
                    console.log("tv", totalvalue);
                    // Store data for download functionality
                    currentMonthlyData = totalvalue;
                    // Show download button only for monthly data
                    downloadMonthlyDataBtn.style.display = 'inline-block';
                    handleEnergyDataResponse(matchingDevices, totalvalue, 'month');
                })
                .catch(error => {
                    console.error('Error in fetching all energy data:', error);
                });
        }



        function safeDestroyChart(chart) {
            if (chart && typeof chart.destroy === 'function') {
                chart.destroy();
            }
        }

        function signOut() {

            const params = new URLSearchParams(window.location.search);
            const accessToken = params.get('accessToken');
            console.log("Access Token before sign out:", accessToken);

            if (accessToken) {
                window.location.href = `https://aioty.netlify.app/index.html?accessToken=${accessToken}`;
            } else {

                window.location.href = 'https://aioty.netlify.app/index.html';
            }
        }


        function menuToggle() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('show');
        }



        // Function to fetch device costs dynamically from the database
        function fetchDeviceCosts() {
            return $.ajax({
                url: 'https://aioty.co.in/tag/prego/avgcost.php',  // Replace with your actual API endpoint
                method: 'GET',
                dataType: 'json'
            });
        }


        function getCostByDeviceId(ud_id, deviceCosts) {
            const device = deviceCosts.find(d => d.device_id === ud_id);
            return device ? device.cost : 0;
        }

        let totalAverageEnergy;
        let oncount = [];
        function handleEnergyDataResponse(matchingDevices, energyData, viewType) {
            oncount = [];
            fetchDeviceCosts().then(deviceCosts => {
                console.log('ud_id final:', ud_idArray);
                console.log('Device Costs:', deviceCosts);
                console.log('Energy Data:', energyData);
                if (energyData.length > 0) {
                    for (let i = 0; i < ud_idArray.length; i++) {
                        let oncount1 = (energyData.find(item => item.ud_id == ud_idArray[i] && item.avg_energy!=0));
                        if (oncount1 != undefined) {
                            oncount.push(oncount1);
                        }
                    }
                }
                function formatCount(value) {
                    return value < 10 ? `0${value}` : value;
                }

                document.getElementById('count2').innerText = formatCount(oncount.length);
                document.getElementById('count3').innerText = formatCount(ud_idArray.length - oncount.length);

                console.log('oncount', oncount)
                if (energyData.length === 0) {
                    displayNoDataMessage();
                    return;
                }


                const totalAverageEnergy = energyData.reduce((sum, data) => {
                    const avgEnergyInKWh = data.avg_energy / 3600000;
                    return sum + avgEnergyInKWh;
                }, 0);


                const totalEnergyCost = energyData.reduce((sum, data) => {
                    const avgEnergyInKWh = data.avg_energy / 3600000;
                    const costPerKWh = getCostByDeviceId(data.ud_id, deviceCosts);
                    const energyCost = avgEnergyInKWh * costPerKWh;
                    return sum + energyCost;
                }, 0);


                totalEnergySpan.textContent = `${totalAverageEnergy.toFixed(2)} kWh`;
                totalCostSpan.textContent = `${totalEnergyCost.toFixed(2)} INR`;


                document.getElementById('barChart').style.display = 'block';
                document.getElementById('pieChart').style.display = 'block';


                if (viewType === 'day') {
                    updateBarChartHourly(energyData);
                } else if (viewType === 'month') {
                    updateBarChartDaily(energyData);
                }
                updatePieChart(matchingDevices, energyData, totalAverageEnergy);
                updateTable(matchingDevices, energyData, totalAverageEnergy);

            }).catch(error => {
                console.error('Error fetching device costs:', error);
                displayNoDataMessage();
            });
        }

        // Function to show 'No Data Found' message
        function displayNoDataMessage() {
            Swal.fire({
                icon: 'info',
                title: 'No Data Found',
                text: `No energy data available for the selected date or month/year.`
            }).then(() => {
                safeDestroyChart(barChart);
                safeDestroyChart(pieChart);

                document.getElementById('barChart').style.display = 'none';
                document.getElementById('pieChart').style.display = 'none';
            });

            totalEnergySpan.textContent = '0 kWh';
            totalCostSpan.textContent = '0 INR';
            tableContainer.innerHTML = '';
            downloadMonthlyDataBtn.style.display = 'none';
        }



        function updateBarChartHourly(energyData) {
            console.log("data received", energyData);

            const ctx = document.getElementById('barChart').getContext('2d');
            const hourDataMap = new Map();

            // Aggregate energy by hour
            energyData.forEach(data => {
                const hour = parseInt(data._id, 10);
                if (!hourDataMap.has(hour)) {
                    hourDataMap.set(hour, { totalEnergy: 0, count: 0 });
                }

                const hourEntry = hourDataMap.get(hour);
                const avgEnergyInKWh = data.avg_energy / 3600000;

                hourEntry.totalEnergy += avgEnergyInKWh;
                hourEntry.count += 1;
            });

            // Sort the hour data map in ascending order by hour
            const sortedHourData = Array.from(hourDataMap.entries()).sort((a, b) => a[0] - b[0]);

            // Prepare labels and data arrays in ascending order
            const labels = [];
            const data = [];
            sortedHourData.forEach(([hour, value]) => {
                labels.push(`${hour < 10 ? '0' : ''}${hour}:00`);
                const avgEnergyInKWh = value.totalEnergy / value.count;
                data.push(avgEnergyInKWh);
            });

            // Safely destroy the existing chart before creating a new one
            safeDestroyChart(window.barChart);

            // Create the bar chart
            window.barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Average Energy (kWh)',
                        data: data,
                        backgroundColor: 'rgba(247, 171, 19, 0.8)', // Semi-transparent color
                        borderColor: '#f5c71a',
                        borderWidth: 1,
                        borderRadius: 10, // Rounded corners
                    }]
                },
                options: {
                    animation: {
                        duration: 800, // Animation duration
                        easing: 'easeOutBounce' // Animation easing
                    },
                    scales: {
                        x: {
                            grid: { display: false }
                        },
                        y: {
                            grid: { display: true },
                            ticks: {
                                callback: function (value) {
                                    return `${value.toFixed(2)} kWh`;
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.7)', // Tooltip background color
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            callbacks: {
                                label: function (context) {
                                    return `Average: ${context.raw.toFixed(2)} kWh`;
                                }
                            }
                        }
                    }
                }
            });
        }


        function updateBarChartDaily(energyData) {
            const ctx = document.getElementById('barChart').getContext('2d');

            // Aggregating data for each day
            const aggregatedData = energyData.reduce((acc, data) => {
                const day = data._id;
                if (!acc[day]) {
                    acc[day] = { totalEnergy: 0, count: 0 };
                }
                const avgEnergyInKWh = data.avg_energy / 3600000;
                acc[day].totalEnergy += avgEnergyInKWh;
                acc[day].count += 1;
                return acc;
            }, {});

            // Identify the range of days
            const allDays = energyData.map(data => data._id);
            const minDay = Math.min(...allDays);
            const maxDay = Math.max(...allDays);

            // Fill in missing days with 0 energy
            const labels = [];
            const data = [];

            for (let day = minDay; day <= maxDay; day++) {
                labels.push(`${day}/${monthPicker.value}/${yearPicker.value}`);
                if (aggregatedData[day]) {
                    data.push(aggregatedData[day].totalEnergy);
                } else {
                    data.push(0);
                }
            }

            console.log('labels', labels);
            console.log('data', data);

            // Safely destroy the existing chart before creating a new one
            safeDestroyChart(window.barChart);

            // Create the bar chart
            window.barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Energy (kWh)',
                        data: data,
                        backgroundColor: 'rgba(247, 171, 19, 0.8)', // Semi-transparent color
                        borderColor: '#f5c71a',
                        borderWidth: 1,
                        borderRadius: 10, // Rounded corners
                    }]
                },
                options: {
                    animation: {
                        duration: 800, // Animation duration
                        easing: 'easeOutBounce' // Animation easing
                    },
                    scales: {
                        x: {
                            grid: { display: false }
                        },
                        y: {
                            grid: { display: true },
                            ticks: {
                                callback: function (value) {
                                    return `${value.toFixed(2)} kWh`;
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.7)', // Tooltip background color
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            callbacks: {
                                label: function (context) {
                                    return `Total: ${context.raw.toFixed(2)} kWh`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updatePieChart(matchingDevices, energyData, totalEnergy) {
            if (totalEnergy === 0) {
                console.error('Total energy is zero.');
                //return;
            }

            // Group energy data by ud_id and sum the avg_energy
            const groupedEnergyData = energyData.reduce((acc, current) => {
                const { ud_id, avg_energy } = current;
                acc[ud_id] = (acc[ud_id] || 0) + (avg_energy || 0) / 3600000; // Convert to kWh
                return acc;
            }, {});

            const labels = [];
            const data = [];
            const displayNamesWithValues = {}; // To keep track of non-zero labels for the legend
           
            mergedArray.forEach(device => {
                const ud_id = device.split(',')[1];
                const name = device.split(',')[0];
                const displayName = name || 'Unknown Device';

                const avgEnergy = groupedEnergyData[ud_id] || 0;
                const energyPercentage = avgEnergy && totalEnergy > 0
                    ? (avgEnergy / totalEnergy) * 100
                    : 0;

                labels.push(displayName);
                data.push(parseFloat(energyPercentage.toFixed(2)));

                
                if (energyPercentage > 0) {
                    displayNamesWithValues[displayName] = true;
                }
            });

           
            const backgroundColors = labels.map((_, index) => {
                const hue = (index * 360 / labels.length) % 360;
                return `hsl(${hue}, 70%, 50%)`;
            });

            safeDestroyChart(pieChart);

            const ctxPie = document.getElementById('pieChart').getContext('2d');
           
            
            pieChart = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: backgroundColors.slice(0, labels.length),
                        borderColor: '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                filter: function (legendItem, chartData) {
                                    return chartData.datasets[0].data[legendItem.index] > 0;
                                }
                            }
                        }
                    }
                }
            });
        }


        function updateTable(matchingDevices, energyData, totalEnergy) {
            tableContainer.innerHTML = '';
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const headers = ['Device Name', 'Energy Consumption (kWh)', 'Energy Percentage', 'Actions'];

            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.innerText = headerText;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            const tbody = document.createElement('tbody');

            function addRow(displayName, avgEnergy, energyPercentage, deviceUdId) {
                const row = document.createElement('tr');

                const deviceCell = document.createElement('td');
                deviceCell.innerText = displayName;
                row.appendChild(deviceCell);

                const consumptionCell = document.createElement('td');
                consumptionCell.innerText = avgEnergy ? avgEnergy.toFixed(2) : '0';
                row.appendChild(consumptionCell);

                const percentageCell = document.createElement('td');
                percentageCell.innerText = energyPercentage ? energyPercentage.toFixed(2) + '%' : '0%';
                row.appendChild(percentageCell);

                const actionsCell = document.createElement('td');
                const actionButton = document.createElement('span');
                actionButton.innerText = 'Know More';
                actionButton.style.textDecoration = 'underline';
                actionButton.style.color = 'rgb(49, 156, 243)';
                actionButton.style.cursor = 'pointer';
                actionButton.onclick = function () {
                    const params = new URLSearchParams({ ud_id: deviceUdId, displayName, accessToken });
                    window.location.href = `https://aioty.co.in/prego_0.1/oauth-server/public/data.html?${params.toString()}`;
                };
                actionsCell.appendChild(actionButton);
                row.appendChild(actionsCell);

                tbody.appendChild(row);
            }

            const groupedEnergyData = energyData.reduce((acc, current) => {
                const { ud_id, avg_energy } = current;
                acc[ud_id] = (acc[ud_id] || 0) + (avg_energy || 0) / 3600000;
                return acc;
            }, {});

            mergedArray.forEach(device => {
                const ud_id = device.split(',')[1];
                const name = device.split(',')[0];
                const displayName = name || 'Unknown Device';

                const avgEnergy = groupedEnergyData[ud_id] || 0;
                const energyPercentage = avgEnergy && totalEnergy > 0
                    ? (avgEnergy / totalEnergy) * 100
                    : 0;

                addRow(displayName, avgEnergy, energyPercentage, ud_id);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            tableContainer.appendChild(table);
        }



    </script>

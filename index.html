<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prego-Smart Kitchen</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/images/prego_favicon.png" />

    <!-- Custom CSS -->
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #fff8e1 0%, #f7f7f7 60%, #ffe8b3 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 0;
        }
        .card {
            background-color: #fff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(247, 171, 19, 0.18), 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 36px 32px;
            text-align: center;
        }
        .logo-img {
            max-width: 220px;
            width: 70%;
            margin: 0 auto 16px;
            display: block;
        }
        p {
            color: #777;
            margin: 0 0 32px;
            font-size: 0.95rem;
        }
        .form-label {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #d9d9d9;
            font-size: 1rem;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #f7ab13;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(247, 171, 19, 0.2);
        }
        .form-check {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .form-check-label {
            color: #555;
            font-size: 0.85rem;
        }
        .form-check-input {
            margin-right: 8px;
            accent-color: #f7ab13;
        }
        .btn {
            background: linear-gradient(90deg, #f7ab13, #f5c71a);
            color: #fff;
            padding: 13px;
            border: none;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(247, 171, 19, 0.35);
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
        }
        .btn:hover {
            background: linear-gradient(90deg, #f5c71a, #f7ab13);
            box-shadow: 0 6px 16px rgba(247, 171, 19, 0.45);
            transform: translateY(-1px);
        }
        .btn:active { transform: translateY(0); }
        .text-underline {
            text-decoration: none;
            color: #f7ab13;
            cursor: pointer;
            font-weight: 600;
        }
        .text-underline:hover { text-decoration: underline; color: #d99200; }
        #error {
            color: #e03131;
            font-size: 0.9rem;
            display: none;
            background: #fff5f5;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        #loading {
            display: none;
            font-size: 0.95rem;
            color: #f7ab13;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .mt-3 {
            margin-top: 20px;
            color: #777;
            font-size: 0.9rem;
        }

        /* Responsive: laptops & tablets */
        @media (min-width: 1024px) {
            .container { max-width: 440px; }
            .card { padding: 40px 36px; }
        }
        @media (min-width: 1440px) {
            .container { max-width: 460px; }
        }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .card { padding: 30px 24px; }
            .logo-img { max-width: 180px; }
            p { margin-bottom: 24px; }
        }
        @media (max-width: 480px) {
            .card { padding: 24px 18px; border-radius: 14px; }
            .form-control { padding: 10px 12px; }
            .form-check { font-size: 0.8rem; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <a href="../../dashboard/">
                <img src="images/prego.png" alt="Prego Logo" class="logo-img">
            </a>
            <p>Sign in to stay connected.</p>
            <form>
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>

                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>

                <div class="form-check">
                    <div>
                        <input type="checkbox" id="rememberMe" class="form-check-input">
                        <label for="rememberMe" class="form-check-label">Remember Me</label>
                    </div>
                    <a href="recoverpw.html" class="text-underline">Forgot Password?</a>
                </div>

                <div id="error" class="text-danger text-center">**Enter valid details</div>
                <div id="loading">Logging in...</div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            <p class="mt-3">Don’t have an account? <span class="text-underline">Click here to sign up.</span></p>
        </div>
    </div>
    <script>
        function getAccessToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get('accessToken'); 
}

const accessToken = getAccessToken(); ;
// getAccessToken();

if (!accessToken) {
    // Ask the user for confirmation before redirecting
    const userConfirmed = confirm("No access token found. Do you want to proceed to the login page?");
    
    if (userConfirmed) {
        // Redirect to the OAuth authorization URL if the user confirms
        window.location.href = "https://partner.feturtles.com/authstart?state=123456&client_id=xpfaaOgscZ6PHmkAh3zwP&redirect_uri=https://aioty.netlify.app/.netlify/functions/index/catchOauthToken";
    } else {
        // Optionally, handle the case where the user cancels the action
        console.log("User canceled the redirection.");
    }
} else {
    console.log("Access token found:", accessToken);
}

window.addEventListener('DOMContentLoaded', function() {
    const userEmail = localStorage.getItem('userEmail');
    
    if (userEmail) {
        console.log('Logged in user email:', userEmail);
    } else {
        console.log('No email found in localStorage. Redirecting to login...');
        
    }
});

document.querySelector('form').addEventListener('submit', function(event) {
    event.preventDefault(); 
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    document.getElementById('loading').style.display = 'block';

    fetch(`https://aioty.co.in/tag/prego/prego_login.php?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to fetch data');
            }
            return response.json();
        })
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            
            if (data.success) {
                alert(data.message);
                localStorage.setItem('userEmail', email);
console.log('datgadoh',data.ud_id);
console.log('datgadoh',data.customers);
                if (data.ud_id && data.customers) {
                    const params = new URLSearchParams({
                        accessToken: accessToken,
                        ud_id: data.ud_id,
                        customers: data.customers
                    
                    });

                    // window.location.href = 'energy.html?' + params.toString();
                    window.location.href = 'https://aioty.co.in/prego_0.1/oauth-server/public/energy.html?' + params.toString();

                } else {
                    alert('Missing UD ID or customer names.');
                }
            } else {
                document.getElementById('error').innerText = data.message;
                document.getElementById('error').style.display = 'block';
            }
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').innerText = 'An error occurred. Please try again.';
            document.getElementById('error').style.display = 'block';
        });
});
